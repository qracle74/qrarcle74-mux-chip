yaml_version: 6

project:
  title:        "2-bit 4-to-1 Multiplexer"
  author:       "Your Name"
  discord:      ""
  description:  "A simple 2-bit 4-to-1 multiplexer"
  language:     "Verilog"
  clock_hz:     0

  # 타일 크기 (가장 작은 1x1 선택)
  tiles: "1x1"

  # project.v에서 정의한 최상위 모듈 이름
  top_module:  "tt_um_mux4to1"

  # 소스 파일 목록
  source_files:
    - "project.v"

# 핀 매핑 정보
pinout:
  # Inputs (ui_in)
  ui[0]: "d0[0]"
  ui[1]: "d0[1]"
  ui[2]: "d1[0]"
  ui[3]: "d1[1]"
  ui[4]: "d2[0]"
  ui[5]: "d2[1]"
  ui[6]: "d3[0]"
  ui[7]: "d3[1]"

  # Outputs (uo_out)
  uo[0]: "out[0]"
  uo[1]: "out[1]"
  uo[2]: ""
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins (uio)
  uio[0]: "addr0"
  uio[1]: "addr1"
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

documentation:
  how_it_works: |
    A 2-bit 4-to-1 multiplexer selecting one of four 2-bit inputs (d0-d3) using addr0 and addr1.
  how_to_test: |
    Set d0-d3 on ui_in[7:0] and select the channel using uio_in[1:0]. Read the output on uo_out[1:0].
  external_hw:  ""
