project:
  title:        "2-bit 4-to-1 Multiplexer"
  author:       "Your Name"
  discord:      ""
  description:  "A simple 2-bit 4-to-1 multiplexer"
  language:     "Verilog"
  clock_hz:     0

  # 타일 크기 (가장 작은 1x1 선택)
  tiles: "1x1"

  # 위 project.v에서 정의한 최상위 모듈 이름과 반드시 일치해야 함
  top_module:  "tt_um_mux4to1"

  # 소스 파일 목록
  source_files:
    - "project.v"

# 핀 매핑 정보 (문서화 및 검증용)
pinout:
  # Inputs (ui_in)
  ui[0]: "d0[0]"
  ui[1]: "d0[1]"
  ui[2]: "d1[0]"
  ui[3]: "d1[1]"
  ui[4]: "d2[0]"
  ui[5]: "d2[1]"
  ui[6]: "d3[0]"
  ui[7]: "d3[1]"

  # Outputs (uo_out)
  uo[0]: "out[0]"
  uo[1]: "out[1]"
  uo[2]: ""
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins (uio)
  uio[0]: "addr0"
  uio[1]: "addr1"
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""
